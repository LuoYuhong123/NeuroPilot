name: neumar
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - nodefaults
variables:
  # Primarily needed on Windows. Harmless on Linux and keeps the environment
  # definition identical across platforms.
  KMP_DUPLICATE_LIB_OK: "TRUE"
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - tifffile
  - scikit-image
  - pyyaml
  - pillow
  - opencv
  - h5py
  - joblib
  - numba
  - llvm-openmp
  - pip:
      # The public main environment intentionally installs only the core PyTorch
      # wheel through pip. It does not require conda-side torchaudio/torchvision.
      # If `conda env create` fails while mentioning `torchaudio` or another
      # package absent from this file, first confirm the local YAML copy you are
      # using, then inspect hidden conda pins and retry with a clean cache or the
      # classic solver.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - csbdeep
      - gdown
      - tqdm
      - tqdm-joblib
